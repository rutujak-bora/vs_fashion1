name: VS Fashion CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Backend to EC2 via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          source: "backend/*"
          target: "/home/ubuntu/backend"
          strip_components: 1

      - name: Deploy Backend Service Config via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          source: "vs-backend.service"
          target: "/home/ubuntu"

      - name: Update Live Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/backend
            # Ensure system-level python3-venv and pip are available
            sudo apt-get install -y python3-venv python3-pip
            # Always recreate venv to avoid stale/broken environments (pip cache makes this fast)
            rm -rf venv
            python3 -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            ./venv/bin/python seed_policies.py || echo "Seed failed, ignoring..."
            
            # Setup and restart systemd service on frontend server
            sudo cp /home/ubuntu/vs-backend.service /etc/systemd/system/vs-backend.service
            sudo systemctl daemon-reload
            sudo systemctl enable vs-backend.service
            sudo systemctl restart vs-backend.service

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm install ajv@^8 --legacy-peer-deps
          REACT_APP_BACKEND_URL="" CI=false npm run build
          
      - name: Deploy Frontend to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          source: "frontend/build/*"
          target: "/home/ubuntu/frontend/build_new"
          strip_components: 2

      - name: Deploy Nginx Config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          source: "vs-frontend.nginx"
          target: "/home/ubuntu/"

      - name: Update Live Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            # Atomic swap of build directory
            sudo rm -rf /home/ubuntu/frontend/build_old
            [ -d "/home/ubuntu/frontend/build" ] && mv /home/ubuntu/frontend/build /home/ubuntu/frontend/build_old
            mv /home/ubuntu/frontend/build_new /home/ubuntu/frontend/build
            
            # Apply Nginx Config
            sudo cp /home/ubuntu/vs-frontend.nginx /etc/nginx/sites-available/vs-frontend
            sudo ln -sf /etc/nginx/sites-available/vs-frontend /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo systemctl restart nginx
