name: VS Fashion CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_IP }}
          username: ubuntu
          key: ${{ secrets.BACKEND_SSH_KEY }}
          script: |
            cd /home/ubuntu/backend
            git remote set-url origin https://github.com/rutujak-bora/vs_fashion1.git
            git pull origin main || (git fetch --all && git reset --hard origin/main)
            # Ensure venv exists and update dependencies
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart vs-backend.service

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm install ajv@^8 --legacy-peer-deps
          REACT_APP_BACKEND_URL="http://${{ secrets.BACKEND_IP }}:8000" CI=false npm run build
          
      - name: Deploy Frontend to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          source: "frontend/build/*"
          target: "/home/ubuntu/frontend/build_new"
          strip_components: 2

      - name: Deploy Nginx Config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          source: "vs-frontend.nginx"
          target: "/home/ubuntu/"

      - name: Update Live Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ubuntu
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            # Atomic swap of build directory
            sudo rm -rf /home/ubuntu/frontend/build_old
            [ -d "/home/ubuntu/frontend/build" ] && mv /home/ubuntu/frontend/build /home/ubuntu/frontend/build_old
            mv /home/ubuntu/frontend/build_new /home/ubuntu/frontend/build
            
            # Apply Nginx Config
            sudo cp /home/ubuntu/vs-frontend.nginx /etc/nginx/sites-available/vs-frontend
            sudo ln -sf /etc/nginx/sites-available/vs-frontend /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo systemctl restart nginx
            
            # Setup SSL via Certbot (Only if not already configured)
            if [ ! -d "/etc/letsencrypt/live/vs-fashion.com" ]; then
              echo "Installing Certbot and generating SSL..."
              sudo apt update
              sudo apt install -y certbot python3-certbot-nginx
              sudo certbot --nginx -d vs-fashion.com -d www.vs-fashion.com --non-interactive --agree-tos -m vsfashiiiion@gmail.com --redirect
            else
              echo "SSL Certificate already exists for vs-fashion.com. Skipping."
            fi
